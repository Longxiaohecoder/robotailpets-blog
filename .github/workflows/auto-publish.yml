name: Auto Generate and Publish Posts

permissions:
  contents: write

concurrency:
  group: robotail-content-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 每周一、二、四北京时间 09:00 (UTC 01:00)，每次一篇
    - cron: '0 1 * * 1,2,4'
  workflow_dispatch: # 允许手动触发

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install blog dependencies
        run: cd blog && npm ci

      - name: Validate generator
        run: npm test

      - name: Publish one queued or newly generated English cat article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://heyroute.ai' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-8' }}
          CONTENT_TOPIC: ${{ vars.CONTENT_TOPIC || 'Robotail litter boxes, feeding routines, and accessories for a cat-friendly home' }}
          CONTENT_LANGUAGE: en
          POSTS_PER_RUN: '1'
          BLOG_AUTHOR: Robotail Editorial Team
        run: npm run publish:next

      - name: Validate site before publishing repository changes
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain -- blog/src/content/posts/ content/publication-history.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push new posts
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- blog/src/content/posts/ content/publication-history.json
          git commit -m "Auto: Publish one Robotail Journal article [$(date -u +'%Y-%m-%d %H:%M')]"
          git push

      - name: No new content
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes detected"
