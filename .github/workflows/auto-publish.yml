name: Auto Generate and Publish Posts

on:
  schedule:
    # 每天北京时间 09:00 (UTC 01:00) 自动运行
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install blog dependencies
        run: cd blog && npm install

      - name: Generate new content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://heyroute.ai' }}
          CONTENT_TOPIC: ${{ vars.CONTENT_TOPIC || '技术、营销、SEO' }}
          CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE || 'zh' }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR || 'robotailpets 评测团队' }}
        run: npm run generate:enhanced

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code blog/src/content/posts/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push new posts
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add blog/src/content/posts/
          git commit -m "🤖 Auto: Generate new blog post(s) [$(date +'%Y-%m-%d %H:%M')]"
          git push

      - name: No new content
        if: steps.git-check.outputs.changed != 'true'
        run: echo "✅ No new content generated or no changes detected"
