name: Publish Approved Robotail Articles

permissions:
  contents: write

concurrency:
  group: robotail-content-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 每周一、二、四北京时间 09:00 (UTC 01:00)，每次一篇
    - cron: '0 1 * * 1,2,4'
    # 云端补跑；同日发布记录防止重复，不再依靠本地免确认补发任务。
    - cron: '30 2 * * 1,2,4'
  workflow_dispatch: # 允许手动触发

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install blog dependencies
        run: cd blog && npm ci

      - name: Validate generator
        run: npm test

      - name: Require human approval; never generate during publication
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const plan = JSON.parse(fs.readFileSync('content/publication-plan.json')); if (plan.requireApproval !== true) throw new Error('Human approval must be enabled');"
          npm run publish:next

      - name: Validate site before publishing repository changes
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain -- blog/src/content/posts/ content/publication-history.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push new posts
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- blog/src/content/posts/ content/publication-history.json
          git commit -m "Auto: Publish one Robotail Journal article [$(date -u +'%Y-%m-%d %H:%M')]"
          git push

      - name: No new content
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes detected"
